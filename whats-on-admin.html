<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What's On Manager | Hexham Santa Admin</title><style>
:root{--ink:#1a1208;--paper:#f5ead6;--cream:#fdf6e8;--burgundy:#7a1f2e;--gold:#c49a2a;--green:#0f1f1a}*{box-sizing:border-box}body{margin:0;background:var(--green);color:var(--paper);font:17px/1.5 Georgia,serif}.wrap{max-width:950px;margin:auto;padding:25px 16px}.card{background:var(--cream);color:var(--ink);padding:22px;border-radius:13px;margin-bottom:16px}h1,h2{font-family:Georgia,serif}input,select,textarea{width:100%;padding:10px;border:1px solid #d7c7a7;border-radius:7px;margin:4px 0 12px;font:inherit}label{font-weight:bold;font-size:.9rem}button{border:0;border-radius:8px;padding:10px 15px;background:var(--burgundy);color:white;font-weight:bold;cursor:pointer}.secondary{background:#e8d5b0;color:var(--ink)}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.eventrow{border-top:1px solid #ddd0b7;padding:13px 0;display:flex;justify-content:space-between;gap:12px}.muted{color:#756b5c}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{padding:10px;background:#eee3cc;border-radius:7px;margin:10px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.card{padding:16px}.eventrow{display:block}.actions{margin-top:8px}}
</style></head><body><main class="wrap"><div class="top"><div><p>HEXHAM SANTA • ADMIN</p><h1>What's On Manager</h1><p>Manage the public Hexham Christmas events calendar.</p></div><a href="/whats-on.html" style="color:#e8be50">View public calendar ↗</a></div>
<section id="login" class="card"><h2>Admin sign in</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="signin">Sign in</button><p id="loginmsg" class="muted"></p></section>
<section id="manager" class="hidden"><div class="card"><div class="top"><h2 id="formtitle">Add an event</h2><button id="logout" class="secondary">Sign out</button></div><form id="eventform"><input id="id" type="hidden"><label>Event name *</label><input id="title" required maxlength="180"><div class="formgrid"><div><label>Date *</label><input id="event_date" type="date" required></div><div><label>End date (for multi-day events)</label><input id="end_date" type="date"></div><div><label>Start time (optional)</label><input id="start_time" type="time"></div><div><label>End time (optional)</label><input id="end_time" type="time"></div><div><label>Venue</label><input id="venue" maxlength="180"></div><div><label>Category</label><select id="category"><option>Family</option><option>Markets & Shopping</option><option>Music</option><option>Theatre & Cinema</option><option>Workshops</option><option>Food & Drink</option><option>Community</option><option>Other</option></select></div></div><label>Short description</label><textarea id="description" rows="2" maxlength="500"></textarea><div class="formgrid"><div><label>Information link</label><input id="info_url" type="url" placeholder="https://"></div><div><label>Booking / ticket link</label><input id="booking_url" type="url" placeholder="https://"></div></div><label><input id="published" type="checkbox" style="width:auto"> Published on public calendar</label><p class="actions"><button type="submit">Save event</button><button type="button" id="clear" class="secondary">Clear form</button></p><div id="msg" class="notice hidden" aria-live="polite"></div></form></div>
<div class="card"><h2>Current events</h2><p class="muted">Unpublished events are only visible here. Edit an event to add missing times or links.</p><div id="list">Loading…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient("https://atqhqizzfnsokulmupmy.supabase.co","sb_publishable_-TvnUkpHRB9jkkNqJQAXCA_tkaAeY7_");const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let rows=[];
function notice(t){$("#msg").textContent=t;$("#msg").classList.remove("hidden")}
async function refresh(){const {data,error}=await sb.from("santa_whats_on_events").select("*").order("event_date").order("sort_order");if(error){$("#list").textContent=error.message;return}rows=data||[];$("#list").innerHTML=rows.map(e=>'<div class="eventrow"><div><strong>'+esc(e.title)+'</strong><div class="muted">'+esc(e.event_date)+(e.start_time?' · '+esc(e.start_time.slice(0,5)):' · All day')+' · '+esc(e.venue||'Venue TBC')+' · '+(e.published?'Published':'Draft')+'</div></div><div class="actions"><button class="secondary" data-edit="'+e.id+'">Edit</button><button data-pub="'+e.id+'" class="secondary">'+(e.published?'Unpublish':'Publish')+'</button><button data-del="'+e.id+'">Delete</button></div></div>').join("")||"No events yet.";document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll("[data-pub]").forEach(b=>b.onclick=()=>toggle(b.dataset.pub));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>remove(b.dataset.del))}
function edit(id){const e=rows.find(x=>x.id===id);if(!e)return;["id","title","event_date","end_date","start_time","end_time","venue","category","description","info_url","booking_url"].forEach(k=>$("#"+k).value=e[k]||"");$("#published").checked=e.published;$("#formtitle").textContent="Edit event";window.scrollTo({top:0,behavior:"smooth"})}
function clearForm(){$("#eventform").reset();$("#id").value="";$("#formtitle").textContent="Add an event";$("#msg").classList.add("hidden")}
$("#clear").onclick=clearForm;$("#eventform").onsubmit=async ev=>{ev.preventDefault();const id=$("#id").value;const payload={title:$("#title").value.trim(),event_date:$("#event_date").value,end_date:$("#end_date").value||null,start_time:$("#start_time").value||null,end_time:$("#end_time").value||null,venue:$("#venue").value.trim()||null,category:$("#category").value,description:$("#description").value.trim()||null,info_url:$("#info_url").value.trim()||null,booking_url:$("#booking_url").value.trim()||null,published:$("#published").checked,updated_at:new Date().toISOString()};const q=id?sb.from("santa_whats_on_events").update(payload).eq("id",id):sb.from("santa_whats_on_events").insert(payload);const {error}=await q;if(error){notice(error.message);return}clearForm();notice("Event saved.");await refresh()};
async function toggle(id){const e=rows.find(x=>x.id===id);const {error}=await sb.from("santa_whats_on_events").update({published:!e.published,updated_at:new Date().toISOString()}).eq("id",id);if(error)alert(error.message);await refresh()}
async function remove(id){const e=rows.find(x=>x.id===id);if(!confirm('Delete "'+e.title+'"?'))return;const {error}=await sb.from("santa_whats_on_events").delete().eq("id",id);if(error)alert(error.message);await refresh()}
async function auth(){const {data:{session}}=await sb.auth.getSession();if(!session){$("#login").classList.remove("hidden");$("#manager").classList.add("hidden");return}const {data:admin,error}=await sb.from("santa_admins").select("user_id").eq("user_id",session.user.id).maybeSingle();if(error||!admin){await sb.auth.signOut();$("#loginmsg").textContent="This account is not authorised as a Santa administrator.";return}$("#login").classList.add("hidden");$("#manager").classList.remove("hidden");await refresh()}
$("#signin").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("#email").value,password:$("#password").value});if(error){$("#loginmsg").textContent=error.message;return}await auth()};$("#logout").onclick=async()=>{await sb.auth.signOut();await auth()};sb.auth.onAuthStateChange(()=>setTimeout(auth,0));auth();
</script></body></html>
