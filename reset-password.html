<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hexham Santa | Reset password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f1f1a;color:#f5ead6;font:18px/1.5 Georgia,serif;display:grid;place-items:center;padding:20px}.card{width:min(100%,480px);background:#fdf6e8;color:#1a1208;border-radius:14px;padding:28px}h1{margin-top:0}label{display:block;font-weight:bold;margin-top:14px}input{width:100%;padding:12px;border:1px solid #d7c7a7;border-radius:8px;margin:5px 0 12px;font:inherit}button{border:0;border-radius:999px;padding:12px 20px;background:#7a1f2e;color:#fff;font-weight:bold;font-size:1rem;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.notice{padding:12px;background:#eee3cc;border-radius:8px;margin:14px 0}.hidden{display:none!important}a{color:#7a1f2e}
</style>
</head>
<body>
<main class="card">
<p>HEXHAM SANTA • 2026</p>
<h1>Choose a new password</h1>
<p>Enter your new password below. You will be able to use it to sign in to Santa Admin and the Box Office.</p>
<div id="status" class="notice" role="status" aria-live="polite">Checking your password reset link…</div>
<form id="reset-form" class="hidden">
<label for="new-password">New password</label>
<input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
<label for="confirm-password">Confirm new password</label>
<input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
<button id="save-password" type="submit">Save new password</button>
</form>
<p><a href="/admin.html">Return to Santa Admin</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient("https://atqhqizzfnsokulmupmy.supabase.co","sb_publishable_-TvnUkpHRB9jkkNqJQAXCA_tkaAeY7_");
const statusEl=document.getElementById("status");
const form=document.getElementById("reset-form");
let recoverySession=false;
function showRecoveryForm(){
 recoverySession=true;
 statusEl.textContent="Your reset link is valid. Choose a new password.";
 form.classList.remove("hidden");
}
sb.auth.onAuthStateChange((event,session)=>{
 if(event==="PASSWORD_RECOVERY"&&session)showRecoveryForm();
});
(async()=>{
 const {data:{session},error}=await sb.auth.getSession();
 if(error){statusEl.textContent="We couldn't verify this reset link. Request a new password reset from the Santa Admin login page.";return;}
 if(session&&window.location.hash.includes("type=recovery"))showRecoveryForm();
 else if(!recoverySession)statusEl.textContent="This reset link is missing or has expired. Please return to Santa Admin and request another one.";
})();
form.addEventListener("submit",async event=>{
 event.preventDefault();
 const password=document.getElementById("new-password").value;
 const confirmation=document.getElementById("confirm-password").value;
 if(password.length<8){statusEl.textContent="Your password must be at least 8 characters.";return;}
 if(password!==confirmation){statusEl.textContent="The passwords do not match.";return;}
 const button=document.getElementById("save-password");
 button.disabled=true;button.textContent="Saving…";
 try{
  const {error}=await sb.auth.updateUser({password});
  if(error)throw error;
  statusEl.textContent="Your password has been updated. You can now sign in to Santa Admin with your new password.";
  form.classList.add("hidden");
  await sb.auth.signOut();
 }catch(error){statusEl.textContent=error?.message||"We couldn't update your password. Please request a new reset link and try again.";}
 finally{button.disabled=false;button.textContent="Save new password";}
});
</script>
</body>
</html>
