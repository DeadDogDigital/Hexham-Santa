<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hexham Santa — Admin</title>
<style>
body{margin:0;background:#0f1f1a;color:#f5ead6;font:18px/1.5 Georgia,serif}.wrap{max-width:1050px;margin:auto;padding:32px 20px}.card{background:#fdf6e8;color:#1a1208;border-radius:14px;padding:24px;margin:0 0 18px}h1,h2{font-family:Georgia,serif}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d7c7a7;border-radius:8px;margin:5px 0 12px;font:inherit}button{border:0;border-radius:999px;padding:11px 18px;background:#7a1f2e;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#e8d5b0;color:#1a1208}.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #ddd0b7;padding:12px 0}.muted{opacity:.7}.hidden{display:none!important}.notice{padding:12px;background:#eee3cc;border-radius:8px;margin-top:12px}
.admin-tools{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-bottom:18px}.filter-buttons{display:flex;flex-wrap:wrap;gap:8px}.filter-buttons button{border:1px solid #d7c7a7}.filter-buttons button.active{background:#c49a2a;color:#1a1208}.date-filter{min-width:180px}.date-filter label{display:block;font-size:.82rem;font-weight:bold;margin-bottom:3px}.print-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.selection-title{font-weight:bold}.booking{border:1px solid #d7c7a7;border-radius:12px;padding:18px;margin:0 0 16px;background:#fffaf0}.booking-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.visit-time{font-size:1.15rem;font-weight:bold}.parent{font-size:1.05rem;font-weight:bold;margin-top:3px}.status{display:inline-block;border-radius:999px;padding:5px 10px;font:bold 13px/1 Georgia,serif;white-space:nowrap}.status.confirmed{background:#dcebdc;color:#24552b}.status.cancelled{background:#ead6d6;color:#7a1f2e}.children{margin-top:16px}.child{border-top:1px solid #ddd0b7;padding:13px 0 3px}.child-head{display:flex;justify-content:space-between;gap:12px;font-size:1.05rem}.child-detail{margin-top:6px}.booking.cancelled{opacity:.65}.booking-count{font-size:.9rem;font-weight:normal;opacity:.7;margin-left:8px}
@media(max-width:700px){.wrap{padding:18px 12px}.card{padding:18px}.booking-top,.child-head{flex-direction:column;gap:5px}.status{align-self:flex-start}.admin-tools{grid-template-columns:1fr}.date-filter{min-width:0}.print-bar{align-items:flex-start;flex-direction:column}}
@media print{body{background:#fff;color:#000;font:11pt/1.35 Arial,sans-serif}.wrap{max-width:none;padding:0}.card{background:#fff;color:#000;padding:0;margin:0 0 12pt;border-radius:0}.card:first-child,.admin-tools,.print-bar button,#auth,#logout{display:none!important}h2{font-size:16pt;margin:0 0 8pt}.booking{background:#fff;border:1px solid #999;border-radius:0;padding:9pt;margin:0 0 9pt;break-inside:avoid}.booking-top{display:flex}.visit-time{font-size:12pt}.parent{font-size:11pt}.children{margin-top:7pt}.child{padding:6pt 0 0}.child-detail{margin-top:2pt}.status{padding:2pt 5pt;border:1px solid #999;background:#fff!important;color:#000!important}.muted{opacity:1;color:#333}.print-hide{display:none!important}}
</style></head><body><main class="wrap"><div class="card"><p>HEXHAM SANTA • 2026</p><h1>Santa Admin</h1><p class="muted">Private operational dashboard. This page is separate from the public Santa homepage.</p></div>
<section id="auth" class="card"><h2>Sign in</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="login">Sign in</button> <button id="signup" class="secondary">Create account</button><div id="msg" class="notice hidden"></div></section>
<section id="app" class="hidden"><div class="card"><div class="row"><div><strong id="who"></strong><div class="muted">Santa administrator</div></div><button id="logout" class="secondary">Sign out</button></div></div>
<div class="card"><div class="admin-tools"><div class="filter-buttons"><button data-filter="next">Next session</button><button data-filter="today">Today</button><button data-filter="tomorrow">Tomorrow</button><button data-filter="all" class="active">All bookings</button></div><div class="date-filter"><label for="date-filter">Choose date</label><input id="date-filter" type="date"></div></div>
<div class="print-bar"><div><h2 style="display:inline">Bookings <span id="booking-count" class="booking-count"></span></h2><div id="selection-title" class="selection-title muted"></div></div><button id="print" class="secondary">🖨 Print this view</button></div><div id="bookings">Loading…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/santa-admin.js"></script></body></html>
