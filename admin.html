<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hexham Santa — Admin</title>
<style>
body{margin:0;background:#0f1f1a;color:#f5ead6;font:18px/1.5 Georgia,serif}.wrap{max-width:1050px;margin:auto;padding:32px 20px}.card{background:#fdf6e8;color:#1a1208;border-radius:14px;padding:24px;margin:0 0 18px}h1,h2{font-family:Georgia,serif}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d7c7a7;border-radius:8px;margin:5px 0 12px;font:inherit}button{border:0;border-radius:999px;padding:11px 18px;background:#7a1f2e;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#e8d5b0;color:#1a1208}.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #ddd0b7;padding:12px 0}.muted{opacity:.7}.hidden{display:none!important}.notice{padding:12px;background:#eee3cc;border-radius:8px;margin-top:12px}
</style></head><body><main class="wrap"><div class="card"><p>HEXHAM SANTA • 2026</p><h1>Santa Admin</h1><p class="muted">Private operational dashboard. This page is separate from the public Santa homepage.</p></div>
<section id="auth" class="card"><h2>Sign in</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="login">Sign in</button> <button id="signup" class="secondary">Create account</button><div id="msg" class="notice hidden"></div></section>
<section id="app" class="hidden"><div class="card"><div class="row"><div><strong id="who"></strong><div class="muted">Santa administrator</div></div><button id="logout" class="secondary">Sign out</button></div></div>
<div class="card"><h2>Bookings</h2><div id="bookings">Loading…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/santa-admin.js"></script></body></html>
