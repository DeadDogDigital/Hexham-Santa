<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Children’s details | Hexham Santa</title><style>body{margin:0;background:#f7f1e5;color:#30291f;font:16px/1.5 Arial,sans-serif}.wrap{max-width:680px;margin:32px auto;padding:16px}.card{background:#fffdf7;border:1px solid #e6dcc8;border-radius:12px;padding:24px;margin-bottom:16px}h1,h2{font-family:Georgia,serif;color:#142820}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #b9ad99;border-radius:6px;font:inherit}textarea{min-height:80px}button{background:#142820;color:white;border:0;border-radius:6px;padding:13px 18px;font:inherit;cursor:pointer}.child{border-top:1px solid #e6dcc8;padding-top:12px;margin-top:20px}.notice{padding:12px;background:#f8f2e6;border-radius:6px;margin:12px 0}.error{color:#9a2525}.hidden{display:none}</style></head><body><main class="wrap"><section class="card"><p>HEXHAM CHRISTMAS</p><h1>A little more for Santa</h1><p>Tell us a little about your children so we can help make their visit special. You can return to this private link to make changes before the 36-hour cut-off.</p><div id="message" class="notice">Loading your booking…</div><div id="form" class="hidden"><p id="visit"></p><div id="children"></div><button id="save">Save children’s details</button></div></section></main><script>
const token=new URLSearchParams(location.search).get("token")||"",msg=document.querySelector("#message"),form=document.querySelector("#form");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let childRows=[];
async function load(){const r=await fetch("/api/santa-child-details?token="+encodeURIComponent(token),{cache:"no-store"});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not load booking.");childRows=d.children||[];document.querySelector("#visit").textContent="Hello "+(d.booking.first_name||"")+". Your visit is "+new Date(d.booking.visit_starts_at).toLocaleString("en-GB",{dateStyle:"full",timeStyle:"short"})+".";document.querySelector("#children").innerHTML=childRows.map((c,i)=>'<div class="child" data-id="'+esc(c.id)+'"><h2>Child '+(i+1)+'</h2><label>Child’s name</label><input data-field="preferred_name" maxlength="100" required value="'+esc(c.preferred_name==="Details awaited"?"":c.preferred_name)+'"><label>Age</label><input data-field="age" type="number" min="0" max="18" value="'+(c.age??"")+'"><label>Interests and things they love</label><textarea data-field="interests" maxlength="1000">'+esc(c.interests||"")+'</textarea><label>Anything you’d like Santa to know</label><textarea data-field="santa_notes" maxlength="1000">'+esc(c.santa_notes||"")+'</textarea></div>').join("");msg.classList.add("hidden");form.classList.remove("hidden")}
document.querySelector("#save").onclick=async()=>{const children=[...document.querySelectorAll(".child")].map(el=>({id:el.dataset.id,preferred_name:el.querySelector('[data-field="preferred_name"]').value,age:el.querySelector('[data-field="age"]').value,interests:el.querySelector('[data-field="interests"]').value,santa_notes:el.querySelector('[data-field="santa_notes"]').value}));const b=document.querySelector("#save");b.disabled=true;b.textContent="Saving…";try{const r=await fetch("/api/santa-child-details?token="+encodeURIComponent(token),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({children})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not save.");msg.textContent="Thank you. Santa has your children’s details.";msg.classList.remove("hidden","error");}catch(e){msg.textContent=e.message;msg.classList.remove("hidden");msg.classList.add("error")}finally{b.disabled=false;b.textContent="Save children’s details"}};
load().catch(e=>{msg.textContent=e.message;msg.classList.add("error")});
</script></body></html>
